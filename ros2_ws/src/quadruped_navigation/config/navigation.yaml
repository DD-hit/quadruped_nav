/navigation/local_planner:
  ros__parameters:
    use_sim_time: false
    reference_path_is_body_path: true
    odom_twist_in_body_frame: true

    fsm.navi_mode: 3
    fsm.thresh_replan: 1.0
    fsm.thresh_no_replan: 0.1
    fsm.planning_horizon: 7.5
    fsm.emergency_time: 1.0
    fsm.fail_safe: true
    fsm.max_replan_fail_count: 1000

    grid_map.resolution: 0.05
    grid_map.sliding_map_size_x: 10.0
    grid_map.sliding_map_size_y: 10.0
    grid_map.sliding_map_size_z: 5.0
    grid_map.local_update_range_x: 5.0
    grid_map.local_update_range_y: 5.0
    grid_map.local_update_range_z: 2.5
    grid_map.map_sliding_en: true
    grid_map.map_sliding_thresh: 0.2
    grid_map.double_cylinder_radius: 0.25
    grid_map.double_cylinder_offset: 0.18
    grid_map.body_height: 0.4
    grid_map.obstacles_inflation_z_up: 0.1
    grid_map.obstacles_inflation_z_down: 0.4
    grid_map.frame_id: map
    grid_map.sliding_map_frame_id: ''
    grid_map.ground_height: -2.5
    grid_map.sensor_type: lidar
    grid_map.require_static_support: true
    grid_map.observation_persistence_s: 3.0
    grid_map.cloud_is_world: true
    grid_map.need_extrinsic: false

    grid_map.cx: 321.04638671875
    grid_map.cy: 243.44969177246094
    grid_map.fx: 387.229248046875
    grid_map.fy: 387.229248046875
    grid_map.depth_filter_maxdist: 3.0
    grid_map.depth_filter_mindist: 0.3
    grid_map.depth_filter_margin: 1
    grid_map.k_depth_scaling_factor: 1000.0
    grid_map.skip_pixel: 2

    grid_map.p_hit: 0.85
    grid_map.p_miss: 0.30
    grid_map.p_min: 0.12
    grid_map.p_max: 0.98
    grid_map.p_occ: 0.80
    grid_map.max_ray_length: 5.0
    grid_map.vis_height: 0.3
    grid_map.show_occ_time: false

    # Query-only reaction margin; physical footprint and occupied data are preserved.
    manager.failure_retry_interval: 0.2
    manager.detour_clearance: 0.4
    manager.collision_clearance: 0.3
    manager.max_vel: 0.15
    manager.max_acc: 0.5
    manager.max_jerk: 4.0
    manager.control_points_distance: 0.2
    manager.feasibility_tolerance: 0.0
    manager.planning_horizon: 7.5

    optimization.lambda_smooth: 1.0
    optimization.lambda_collision: 1.0
    optimization.lambda_feasibility: 0.1
    optimization.lambda_fitness: 1.0
    optimization.lambda_route: 8.0
    optimization.dist0: 0.2
    optimization.vel_tolerance: 0.0001
    optimization.acc_tolerance: 0.0001
    optimization.max_vel: 0.15
    optimization.max_acc: 0.5
    optimization.order: 3

/navigation/trajectory_controller:
  ros__parameters:
    time_forward: 0.4
    heading_error_threshold: 0.8
    kp_pos: 0.8
    kp_yaw: 1.5
    max_vx: 0.15
    max_vy: 0.15
    max_vyaw: 0.5
    finish_dist: 0.15
    finish_yaw: 0.15
    odom_timeout: 0.5
/navigation/global_planner:
  ros__parameters:
    # Native double-cylinder outer radius: 0.25 + 0.18.
    robot_radius: 0.43
    # Require area support, not just one occupied voxel under the center.
    minimum_support_fraction: 0.8
    snap_search_radius_cells: 8
    max_iterations: 250000
    require_ground_support: true
    strict_direct_ground_support: true
    enable_preblocked_costmap: true
    preblocked_costmap_radius_cells: 3
    preblocked_costmap_weight: 1.5
/navigation/navigation_api:
  ros__parameters:
    input_timeout: 2.0
    plan_timeout: 30.0
    goal_timeout: 180.0
    obstacle_wait_timeout_s: 40.0
    goal_tolerance: 0.15
